name: Answer hourly quiz

# Two ways this runs:
#  * Loop (manual "Run workflow", or started by the previous loop): stays up ~5h40m,
#    checking every 3 minutes, then starts its own replacement. Stops itself after Oct 22.
#  * schedule / push: one quick check, as a backup.
on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: ${{ github.event_name == 'workflow_dispatch' && 'loop' || 'quick' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Answer new rounds
        env:
          LOOP: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 340*60 ))
          while true; do
            git pull -q --rebase origin main || true
            python run.py || echo "::warning::low-confidence answer(s), see log above"
            git add answers
            if ! git diff --cached --quiet; then
              git commit -qm "Answer rounds $(date -u +%Y-%m-%dT%H:%MZ)"
              for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && break; sleep 10; done
              echo "Pushed at $(date -u)"
            fi
            if [ "$LOOP" != "1" ] || [ "$(date +%s)" -ge "$end" ]; then break; fi
            sleep 180
          done
      - name: Start the next loop
        if: always() && github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stop after the assignment: round 168 is released 2026-10-22 20:00 UTC.
          if [ "$(date -u +%Y%m%d%H)" -lt 2026102300 ]; then
            gh workflow run answer.yml --ref main -R "${{ github.repository }}"
          fi
