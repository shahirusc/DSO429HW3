name: Answer hourly quiz

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub may delay a few minutes)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: answer
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Solve new rounds
        id: solve
        continue-on-error: true   # still commit best guesses if something is low-confidence
        run: python run.py
      - name: Commit and push answers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898733+github-actions[bot]@users.noreply.github.com"
          git add answers
          if git diff --cached --quiet; then echo "No new rounds."; exit 0; fi
          git commit -m "Answer rounds $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
      - name: Flag low-confidence answers
        if: steps.solve.outcome == 'failure'
        run: |
          echo "::error::Some questions did not match a known template - check the Solve step log"
          exit 1
